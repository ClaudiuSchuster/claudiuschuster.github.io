<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Open signal</title>
  <desc id="desc">A prismatic orbit around a single open signal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090711"/>
      <stop offset="1" stop-color="#17142e"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70eadf"/>
      <stop offset=".5" stop-color="#f6bd7c"/>
      <stop offset="1" stop-color="#ee6da9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#background)" stroke="#f5f2ff" stroke-opacity=".26" stroke-width="1.5"/>
  <ellipse cx="32" cy="32" rx="25" ry="13" transform="rotate(-28 32 32)" fill="none" stroke="url(#orbit)" stroke-opacity=".35" stroke-width="5" filter="url(#glow)"/>
  <ellipse cx="32" cy="32" rx="25" ry="13" transform="rotate(-28 32 32)" fill="none" stroke="url(#orbit)" stroke-width="2.2"/>
  <ellipse cx="32" cy="32" rx="25" ry="13" transform="rotate(52 32 32)" fill="none" stroke="#9a72e8" stroke-opacity=".72" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="14" fill="#0a0d1c" stroke="#f5f2ff" stroke-opacity=".24"/>
  <circle cx="32" cy="32" r="6" fill="none" stroke="#70eadf" stroke-opacity=".3"/>
  <circle cx="32" cy="32" r="3.2" fill="#70eadf"/>
</svg>
